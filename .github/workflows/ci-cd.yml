name: WUDAU CI/CD & Dokploy Deployment

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # 1. Continuous Integration (CI) - Validation & Build Check
  # ----------------------------------------------------------------------------
  ci:
    name: Codebase Validation & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            admin/backend/package-lock.json
            admin/frontend/package-lock.json

      - name: Validate Backend Dependencies & Syntax
        run: |
          cd admin/backend
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          node -c index.js

      - name: Validate Frontend Dependencies & Build
        env:
          NEXT_PUBLIC_BASE_URL: https://wudao.wolinet.com/
          NEXT_PUBLIC_SECRET_KEY: 5TIvw5cpc0
          NEXT_PUBLIC_PROJECT_NAME: WUDAU
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          cd admin/frontend
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

  # ----------------------------------------------------------------------------
  # 2. Continuous Deployment (CD) - Trigger Dokploy Deploy
  # ----------------------------------------------------------------------------
  cd:
    name: Dokploy Deployment
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Dokploy Webhook
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DOKPLOY_WEBHOOK" ]; then
            echo "Triggering Dokploy deployment webhook..."
            response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$DOKPLOY_WEBHOOK")
            echo "Dokploy response HTTP code: $response"
            if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
              echo "Deployment triggered successfully on Dokploy!"
            else
              echo "Warning: Dokploy returned status $response, please check your Dokploy dashboard."
            fi
          else
            echo "DOKPLOY_WEBHOOK_URL secret not set. Skipping automated webhook trigger."
            echo "You can still deploy directly by clicking 'Deploy' in your Dokploy dashboard."
          fi
