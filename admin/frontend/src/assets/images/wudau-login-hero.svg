<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Solar Blaze Gradient -->
    <linearGradient id="heroBlaze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B1F"/>
      <stop offset="100%" stop-color="#FF9F00"/>
    </linearGradient>

    <!-- Phone Glass Screen Gradient -->
    <linearGradient id="phoneScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140C20"/>
      <stop offset="50%" stop-color="#1A0D28"/>
      <stop offset="100%" stop-color="#0E0716"/>
    </linearGradient>

    <!-- Gold Talent Gradient -->
    <linearGradient id="heroGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F00"/>
      <stop offset="100%" stop-color="#FFD000"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="stageLight" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#FF4B1F" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FF9F00" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#140C20" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Backdrop Circles -->
  <circle cx="250" cy="250" r="180" fill="url(#heroBlaze)" opacity="0.08"/>
  <circle cx="250" cy="250" r="140" fill="none" stroke="url(#heroBlaze)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#heroGold)" stroke-width="1" stroke-dasharray="4 8" opacity="0.2"/>

  <!-- Main Smartphone Mockup Body -->
  <g transform="translate(140, 60)">
    <!-- Phone Outer Shadow & Border -->
    <rect x="-4" y="-4" width="228" height="388" rx="36" fill="#241B32" opacity="0.5"/>
    <rect x="0" y="0" width="220" height="380" rx="32" fill="#0A0612" stroke="url(#heroBlaze)" stroke-width="2"/>

    <!-- Screen Glass -->
    <rect x="10" y="10" width="200" height="360" rx="24" fill="url(#phoneScreen)"/>

    <!-- Phone Notch / Dynamic Island -->
    <rect x="75" y="18" width="70" height="14" rx="7" fill="#000000"/>
    <circle cx="130" cy="25" r="3" fill="#1C1528"/>

    <!-- Spotlight Beam on Stage -->
    <ellipse cx="110" cy="230" rx="85" ry="110" fill="url(#stageLight)"/>

    <!-- Dancer / Talent Silhouette & Motion Rhythm -->
    <!-- Energy Aura behind performer -->
    <path d="M70,220 C85,150 145,160 160,230 C170,280 120,310 95,290 Z" fill="url(#heroBlaze)" opacity="0.25" filter="url(#heroGlow)"/>

    <!-- Stylized Dynamic Dancer Silhouette -->
    <!-- Head with headphone/cap accent -->
    <circle cx="108" cy="140" r="12" fill="#FFFFFF"/>
    <circle cx="108" cy="140" r="15" fill="none" stroke="url(#heroGold)" stroke-width="1.5" opacity="0.8"/>

    <!-- Torso and Kinetic Rhythm Pose -->
    <path d="M106,155 L112,195 L95,225 L80,265" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M112,195 L125,230 L145,260" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Dynamic Expressive Arms in Dance Motion -->
    <path d="M106,165 L135,155 L160,130" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M106,165 L80,180 L62,165" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Flowing Solar Energy Trail wrapping performer -->
    <path d="M55,240 C90,260 140,200 170,210 C190,215 160,260 120,285" fill="none" stroke="url(#heroGold)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <path d="M45,190 C70,170 120,230 165,180" fill="none" stroke="url(#heroBlaze)" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.8"/>

    <!-- Soundwave Equalizer at the bottom of video screen -->
    <g transform="translate(30, 310)" fill="url(#heroBlaze)">
      <rect x="0" y="15" width="4" height="20" rx="2"/>
      <rect x="10" y="5" width="4" height="30" rx="2"/>
      <rect x="20" y="0" width="4" height="35" rx="2"/>
      <rect x="30" y="10" width="4" height="25" rx="2"/>
      <rect x="40" y="18" width="4" height="17" rx="2"/>
      <rect x="50" y="8" width="4" height="27" rx="2"/>
      <rect x="60" y="2" width="4" height="33" rx="2"/>
      <rect x="70" y="12" width="4" height="23" rx="2"/>
      <rect x="80" y="16" width="4" height="19" rx="2"/>
      <rect x="90" y="4" width="4" height="31" rx="2"/>
      <rect x="100" y="0" width="4" height="35" rx="2"/>
      <rect x="110" y="10" width="4" height="25" rx="2"/>
      <rect x="120" y="20" width="4" height="15" rx="2"/>
      <rect x="130" y="8" width="4" height="27" rx="2"/>
      <rect x="140" y="15" width="4" height="20" rx="2"/>
    </g>

    <!-- Floating Heart Reel Like Reaction on Screen -->
    <g transform="translate(170, 240)">
      <circle cx="0" cy="0" r="15" fill="url(#heroBlaze)" filter="url(#heroGlow)"/>
      <path d="M-6,-2 C-6,-5 -3,-7 0,-4 C3,-7 6,-5 6,-2 C6,2 0,6 0,6 C0,6 -6,2 -6,-2 Z" fill="#FFFFFF"/>
    </g>

    <g transform="translate(170, 280)">
      <circle cx="0" cy="0" r="14" fill="#251638"/>
      <text x="0" y="4" font-size="11" fill="#FFD000" text-anchor="middle" font-weight="900">★</text>
    </g>
  </g>

  <!-- Left Floating Card: "Talent Score 98%" Badge -->
  <g transform="translate(35, 160)">
    <rect width="130" height="52" rx="16" fill="#1C1126" stroke="url(#heroBlaze)" stroke-width="1.5" opacity="0.95" filter="url(#heroGlow)"/>
    <circle cx="28" cy="26" r="14" fill="url(#heroBlaze)"/>
    <text x="28" y="31" font-size="14" fill="#FFFFFF" text-anchor="middle">🔥</text>
    <text x="50" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#9CA3AF">TALENT SCORE</text>
    <text x="50" y="39" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#FF9F00">98.4%</text>
  </g>

  <!-- Right Floating Card: "Audience Pulse" Badge -->
  <g transform="translate(325, 290)">
    <rect width="140" height="56" rx="16" fill="#1C1126" stroke="url(#heroGold)" stroke-width="1.5" opacity="0.95" filter="url(#heroGlow)"/>
    <circle cx="28" cy="28" r="14" fill="url(#heroGold)"/>
    <text x="28" y="33" font-size="14" fill="#000000" text-anchor="middle">⚡</text>
    <text x="50" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#9CA3AF">VIRAL RHYTHM</text>
    <text x="50" y="41" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="900" fill="#FF4B1F">250K+ Live</text>
  </g>

  <!-- Top Center WUDAU Glowing Badge -->
  <g transform="translate(250, 45)">
    <circle cx="0" cy="0" r="26" fill="url(#heroBlaze)" filter="url(#heroGlow)"/>
    <text x="0" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">W</text>
  </g>

  <!-- Creative Sparkles and Music Notes -->
  <text x="100" y="110" font-size="20" fill="#FFD000" opacity="0.85">♪</text>
  <text x="390" y="120" font-size="22" fill="#FF9F00" opacity="0.85">♫</text>
  <text x="80" y="390" font-size="18" fill="#FF4B1F" opacity="0.8">♬</text>
  <text x="400" y="430" font-size="24" fill="#FFD000" opacity="0.85">✨</text>
</svg>
