<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Cosmic Obsidian Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080512"/>
      <stop offset="35%" stop-color="#12071E"/>
      <stop offset="70%" stop-color="#1A0A24"/>
      <stop offset="100%" stop-color="#090412"/>
    </linearGradient>

    <!-- Solar Blaze Primary Gradient (WUDAU Identity) -->
    <linearGradient id="solarBlaze" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FF4B1F"/>
      <stop offset="60%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF9F00"/>
    </linearGradient>

    <!-- Hyper Gold Secondary Gradient -->
    <linearGradient id="hyperGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4B1F" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FF9F00" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFD000" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Deep Crimson Rhythm Curve Gradient -->
    <linearGradient id="crimsonRhythm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D92000" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FF4B1F" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#880E4F" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Violet Velvet Base Glow Gradient -->
    <linearGradient id="violetGlow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C27B0" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#4A148C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#080512" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Radial Light Beams -->
    <radialGradient id="radialBlaze1" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#FF4B1F" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#FF4B1F" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080512" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="radialGold1" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#FF9F00" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FF7A00" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080512" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerStageGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#FF4B1F" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#673AB7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080512" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for Luminous Neon Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>

  <!-- 2. Ambient Atmosphere Orbs -->
  <circle cx="300" cy="850" r="650" fill="url(#radialBlaze1)"/>
  <circle cx="1650" cy="200" r="550" fill="url(#radialGold1)"/>
  <circle cx="960" cy="540" r="600" fill="url(#centerStageGlow)"/>

  <!-- 3. Dynamic Soundwave Equalizer Lines (Background subtle rhythm) -->
  <g opacity="0.07" stroke="#FF9F00" stroke-width="2" stroke-linecap="round">
    <!-- Equalizer spectrum bars -->
    <line x1="80" y1="540" x2="80" y2="480"/>
    <line x1="120" y1="540" x2="120" y2="420"/>
    <line x1="160" y1="540" x2="160" y2="360"/>
    <line x1="200" y1="540" x2="200" y2="440"/>
    <line x1="240" y1="540" x2="240" y2="390"/>
    <line x1="280" y1="540" x2="280" y2="490"/>
    <line x1="320" y1="540" x2="320" y2="430"/>
    <line x1="360" y1="540" x2="360" y2="350"/>
    <line x1="400" y1="540" x2="400" y2="410"/>
    <line x1="440" y1="540" x2="440" y2="470"/>

    <line x1="1480" y1="540" x2="1480" y2="460"/>
    <line x1="1520" y1="540" x2="1520" y2="390"/>
    <line x1="1560" y1="540" x2="1560" y2="450"/>
    <line x1="1600" y1="540" x2="1600" y2="340"/>
    <line x1="1640" y1="540" x2="1640" y2="420"/>
    <line x1="1680" y1="540" x2="1680" y2="480"/>
    <line x1="1720" y1="540" x2="1720" y2="370"/>
    <line x1="1760" y1="540" x2="1760" y2="430"/>
    <line x1="1800" y1="540" x2="1800" y2="490"/>
    <line x1="1840" y1="540" x2="1840" y2="450"/>
  </g>

  <!-- 4. Grand Rhythm Wave 1 - Deep Violet & Crimson Ribbon (Bottom-Left to Top-Right) -->
  <path d="M-100,850 C300,1050 600,720 1050,680 C1500,640 1750,900 2050,820 L2050,1150 L-100,1150 Z" 
        fill="url(#violetGlow)" opacity="0.6"/>

  <path d="M-120,620 C250,780 550,540 1020,590 C1490,640 1720,380 2060,420 L2060,1150 L-120,1150 Z" 
        fill="url(#crimsonRhythm)" opacity="0.45"/>

  <!-- 5. Luminous Solar Blaze & Hyper Gold Energy Flow (Signature WUDAU Wave) -->
  <path d="M-100,450 C350,220 700,750 1150,480 C1600,210 1780,520 2050,310" 
        fill="none" stroke="url(#solarBlaze)" stroke-width="8" opacity="0.6" filter="url(#neonGlow)"/>

  <path d="M-80,480 C380,260 680,780 1180,510 C1620,240 1760,540 2070,330" 
        fill="none" stroke="url(#hyperGold)" stroke-width="3" opacity="0.8"/>

  <!-- Grand Sweep Wave (Bottom Wave rising through center) -->
  <path d="M-150,980 C280,820 620,950 1020,760 C1420,570 1700,720 2080,530" 
        fill="none" stroke="url(#solarBlaze)" stroke-width="12" opacity="0.4" filter="url(#neonGlow)"/>

  <path d="M-150,980 C280,820 620,950 1020,760 C1420,570 1700,720 2080,530" 
        fill="none" stroke="#FFF5E5" stroke-width="2" opacity="0.5"/>

  <!-- Secondary Counter-Rhythm Wave (Top-Left to Bottom-Right) -->
  <path d="M-50,180 C400,320 850,120 1300,340 C1650,510 1850,280 2050,400" 
        fill="none" stroke="url(#hyperGold)" stroke-width="4" opacity="0.45" stroke-dasharray="8 6"/>

  <!-- 6. Harmonic Concentric Resonance Rings (Top Right Accent) -->
  <g opacity="0.25">
    <circle cx="1650" cy="180" r="120" fill="none" stroke="#FF9F00" stroke-width="1.5" stroke-dasharray="6 8"/>
    <circle cx="1650" cy="180" r="220" fill="none" stroke="#FF4B1F" stroke-width="1.5"/>
    <circle cx="1650" cy="180" r="340" fill="none" stroke="#FF9F00" stroke-width="1" stroke-dasharray="4 6"/>
  </g>

  <!-- Harmonic Rings (Bottom Left Accent) -->
  <g opacity="0.2">
    <circle cx="250" cy="900" r="160" fill="none" stroke="#FF4B1F" stroke-width="1.5" stroke-dasharray="5 7"/>
    <circle cx="250" cy="900" r="300" fill="none" stroke="#FF9F00" stroke-width="1"/>
    <circle cx="250" cy="900" r="460" fill="none" stroke="#FF4B1F" stroke-width="0.8" stroke-dasharray="3 6"/>
  </g>

  <!-- 7. Creative Talent Sparkles & Beat Particles -->
  <g opacity="0.8">
    <!-- Bright Gold Star Sparkles -->
    <g transform="translate(380, 240)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#FFD000"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
    <g transform="translate(1420, 260)">
      <polygon points="0,-22 5,-5 22,0 5,5 0,22 -5,5 -22,0 -5,-5" fill="#FF9F00"/>
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    </g>
    <g transform="translate(1580, 680)">
      <polygon points="0,-14 3,-3 14,0 3,3 0,14 -3,3 -14,0 -3,-3" fill="#FF4B1F"/>
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
    </g>
    <g transform="translate(240, 620)">
      <polygon points="0,-18 4,-4 18,0 4,4 0,18 -4,4 -18,0 -4,-4" fill="#FF9F00"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
    <g transform="translate(850, 160)">
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#FFD000"/>
      <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
    </g>
    <g transform="translate(1120, 880)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#FF7A00"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Floating Energy Glow Dots -->
    <circle cx="480" cy="380" r="4" fill="#FF4B1F" opacity="0.9" filter="url(#neonGlow)"/>
    <circle cx="520" cy="740" r="5" fill="#FF9F00" opacity="0.8"/>
    <circle cx="780" cy="310" r="3.5" fill="#FFD000" opacity="0.7"/>
    <circle cx="1280" cy="220" r="4" fill="#FF4B1F" opacity="0.8"/>
    <circle cx="1520" cy="460" r="6" fill="#FF9F00" opacity="0.85" filter="url(#neonGlow)"/>
    <circle cx="1680" cy="790" r="4.5" fill="#FF4B1F" opacity="0.75"/>
    <circle cx="940" cy="920" r="5" fill="#FF9F00" opacity="0.8"/>
    <circle cx="160" cy="460" r="3" fill="#FFD000" opacity="0.6"/>
  </g>

  <!-- 8. Subtle Watermark WUDAU Monogram in Background Mesh -->
  <g opacity="0.04" transform="translate(810, 360)">
    <text x="150" y="240" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="280" fill="url(#solarBlaze)" text-anchor="middle" letter-spacing="12">
      WUDAU
    </text>
  </g>
</svg>
